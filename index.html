<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Count Zarruk — Galería</title>
<meta name="description" content="Las fotos de la noche del Conde Zarruk: encontrá tus retratos, descubrí qué personaje fuiste y descargá todo desde Drive. Fotografías por @ottorivera.">
<meta property="og:title" content="Count Zarruk — Galería">
<meta property="og:description" content="Las fotos de la noche del Conde Zarruk: encontrá tus retratos, descubrí qué personaje fuiste y descargá todo desde Drive. Fotografías por @ottorivera.">
<meta property="og:image" content="https://oxxorivera.github.io/count-zarruk-26/96c1a37bf43b55e6fe954ebb5d81a86c.jpg">
<meta property="og:url" content="https://oxxorivera.github.io/count-zarruk-26/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="3e277004057d3d99c590f4223bbe95bf.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap">
<style>
body{margin:0;background:#0E0B0C}
a{color:#E8DCC4}a:hover{color:#FFFFFF}
.zk-root,.zk-root *{cursor:url("d5c1df38bcf330369c4d758008a815ac.svg") 16 16, auto}
.zk-root a,.zk-root a *,.zk-root button{cursor:url("a30447354b3b27eb13cf1bfbcf5776f0.svg") 16 16, pointer !important}
.zk-root:active,.zk-root *:active,.zk-root a:active,.zk-root a:active *,.zk-root button:active,.zk-root button:active *{cursor:url("fc318fd81b64f7ea7032635db047cdf6.svg") 16 16, pointer !important}
@keyframes zk-turn{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes zk-breathe{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes zk-fly{0%{transform:translate(0,0)}50%{transform:translate(10px,-8px)}100%{transform:translate(0,0)}}
.zk-turn{animation:zk-turn 180s linear infinite}
.zk-breathe{animation:zk-breathe 6s ease-in-out infinite}
.zk-fly{animation:zk-fly 7s ease-in-out infinite}
@keyframes zk-glass-a{0%{filter:brightness(1) saturate(1)}18%{filter:brightness(1.9) saturate(1.5)}100%{filter:brightness(1) saturate(1)}}
@keyframes zk-glass-b{0%{filter:brightness(1) saturate(1)}18%{filter:brightness(1.9) saturate(1.5)}100%{filter:brightness(1) saturate(1)}}
@keyframes zk-light-a{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
@keyframes zk-light-b{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
@keyframes zk-flare-a{0%{opacity:0;transform:scale(.9)}20%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.6)}}
@keyframes zk-flare-b{0%{opacity:0;transform:scale(.9)}20%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.6)}}
.zk-fa .zk-glass{animation:zk-glass-a 1.8s ease-out}
.zk-fb .zk-glass{animation:zk-glass-b 1.8s ease-out}
.zk-fa .zk-light{animation:zk-light-a 1.6s ease-out}
.zk-fb .zk-light{animation:zk-light-b 1.6s ease-out}
.zk-fa .zk-flare{animation:zk-flare-a 2s ease-out}
.zk-fb .zk-flare{animation:zk-flare-b 2s ease-out}
.zk-hit:focus-visible{outline:2px solid #D9574F;outline-offset:6px}
@keyframes zk-rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes zk-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes zk-dim{from{opacity:0}to{opacity:1}}
.zk-panel{animation:zk-rise .45s cubic-bezier(.2,.7,.2,1)}
.zk-backdrop{animation:zk-dim .3s ease-out}
.zk-stage{animation:zk-fade .4s ease-out}
.zk-card{transition:border-color .25s ease, transform .25s ease}
.zk-card img{transition:filter .3s ease}
.zk-card:hover{border-color:#8E1B22 !important;transform:translateY(-4px)}
.zk-card:hover img{filter:brightness(1.18) saturate(1.2) drop-shadow(0 0 18px rgba(217,87,79,.35))}
.zk-card:focus-visible{outline:2px solid #D9574F;outline-offset:4px}
.zk-card:hover .zk-cue{color:#FFFFFF}
.zk-opt{transition:background-color .2s ease,border-color .2s ease,transform .2s ease}
.zk-opt:hover{background:#2A1518 !important;border-color:#D9574F !important;transform:translateX(4px)}
.zk-opt:focus-visible{outline:2px solid #D9574F;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.zk-turn,.zk-breathe,.zk-fly,.zk-panel,.zk-backdrop,.zk-stage{animation:none}.zk-card:hover{transform:none}.zk-fa .zk-light,.zk-fb .zk-light,.zk-fa .zk-flare,.zk-fb .zk-flare{animation-duration:.01s}}
</style>

</head>
<body>
<div id="zk-mount"></div>
<template id="zk-template">
<div class="zk-root" style="min-height: 100vh; background: #0E0B0C; color: #E8DCC4; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; line-height: 1.5">

  <header style="position: relative; overflow: hidden; border-bottom: 1px solid #3A2A2C; background: radial-gradient(ellipse at 75% 45%, #3A0F18 0%, #1A0B10 38%, #0E0B0C 72%)">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 118px, rgba(58,42,44,0.35) 118px, rgba(58,42,44,0.35) 120px); opacity: 0.6"></div>
    <div style="position: relative; max-width: 1240px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 40px">

      <div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 22px">
        <div style="display: flex; align-items: center; gap: 14px">
          <span aria-hidden="true" style="display: block; width: 48px; height: 1px; background: #D9574F"></span>
          <p style="margin: 0; font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.34em; text-transform: uppercase; color: #D9574F">Birthday · 2026</p>
        </div>
        <h1 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 700; line-height: 0.88; letter-spacing: 0.02em; color: #F3EAD8">
          <span style="display: block; font-size: clamp(28px, 4.2vw, 52px); font-weight: 400; letter-spacing: 0.42em; color: #C9BBA3">Count</span>
          <span style="display: block; font-size: clamp(64px, 11vw, 148px); text-shadow: 0 0 48px rgba(179,32,46,0.45)">Zarruk</span>
        </h1>
        <p style="margin: 0; max-width: 460px; font-size: 26px; line-height: 1.35; font-style: italic; color: #D8CCB6">Encontrá tus fotos. Guardalas para siempre.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px">
          <a href="#galeria" style="display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 30px; background: #8E1B22; border: 1px solid #D9574F; color: #FFFFFF; text-decoration: none; font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase">Buscar mi retrato</a>
          <button type="button" onClick="{{askAlbum}}" style="display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 30px; border: 1px solid #5A3A3E; color: #F3EAD8; text-decoration: none; font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; background: transparent; font-weight: 400">Álbum completo</button>
        </div>
        <p style="margin: 10px 0 0; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: #A8998A">Fotografías por <a href="https://instagram.com/ottorivera" style="color: #D9574F; text-decoration: underline; text-underline-offset: 4px; text-transform: none; letter-spacing: 0.08em">@ottorivera</a></p>
      </div>

      <div style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center">
        <div id="zk-flash" style="position: relative; width: 100%; max-width: 540px; aspect-ratio: 1 / 1">
          <div aria-hidden="true" class="zk-flare" style="position: absolute; inset: -10%; border-radius: 50%; opacity: 0; background: radial-gradient(circle, rgba(255,214,140,0.55) 0%, rgba(217,87,79,0.35) 40%, rgba(14,11,12,0) 70%); pointer-events: none"></div>
          <div aria-hidden="true" class="zk-breathe" style="position: absolute; inset: -12%; border-radius: 50%; background: radial-gradient(circle, rgba(179,32,46,0.55) 0%, rgba(90,20,40,0.25) 45%, rgba(14,11,12,0) 70%)"></div>
          <div class="zk-turn" style="position: absolute; inset: 0">
            <img class="zk-glass" src="66562f559b4e9eda94f2c1eabe5773a1.svg" alt="Rosetón de vitral con murciélagos y una luna roja al centro" style="width: 100%; height: 100%; display: block">
          </div>
          <img src="13b06858f9add4f486437609233668d1.svg" alt="" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 20%; transform: translate(-50%, -45%); display: block; pointer-events: none">
          <div aria-hidden="true" class="zk-light" style="position: absolute; inset: 2%; border-radius: 50%; opacity: 0; mix-blend-mode: screen; background: radial-gradient(circle, rgba(255,246,214,0.95) 0%, rgba(255,200,120,0.6) 22%, rgba(217,87,79,0.3) 48%, rgba(14,11,12,0) 70%); pointer-events: none"></div>
          <button type="button" class="zk-hit" onClick="{{lightUp}}" aria-label="Iluminar el vitral" style="position: absolute; inset: 0; border-radius: 50%; border: none; padding: 0; margin: 0; background: transparent"></button>
          <div aria-hidden="true" style="position: absolute; inset: -3%; border-radius: 50%; border: 1px solid #5A3A3E; pointer-events: none"></div>
          <svg class="zk-fly" aria-hidden="true" width="72" height="32" viewBox="0 0 64 28" fill="#0B0809" stroke="#D9574F" stroke-width="1" stroke-linejoin="round" style="position: absolute; top: -4%; left: 2%"><path d="M32 22 C28 14 22 10 14 12 C16 8 10 4 2 6 C8 10 8 16 6 22 C12 18 20 18 24 24 C26 22 29 22 32 26 C35 22 38 22 40 24 C44 18 52 18 58 22 C56 16 56 10 62 6 C54 4 48 8 50 12 C42 10 36 14 32 22 Z"></path></svg>
          <svg class="zk-fly" aria-hidden="true" width="44" height="20" viewBox="0 0 64 28" fill="#0B0809" stroke="#D9574F" stroke-width="1.2" stroke-linejoin="round" style="position: absolute; top: 8%; right: -2%; animation-delay: -3s"><path d="M32 22 C28 14 22 10 14 12 C16 8 10 4 2 6 C8 10 8 16 6 22 C12 18 20 18 24 24 C26 22 29 22 32 26 C35 22 38 22 40 24 C44 18 52 18 58 22 C56 16 56 10 62 6 C54 4 48 8 50 12 C42 10 36 14 32 22 Z"></path></svg>
          <svg class="zk-fly" aria-hidden="true" width="36" height="16" viewBox="0 0 64 28" fill="#0B0809" stroke="#D9574F" stroke-width="1.4" stroke-linejoin="round" style="position: absolute; bottom: 4%; left: -3%; animation-delay: -5s"><path d="M32 22 C28 14 22 10 14 12 C16 8 10 4 2 6 C8 10 8 16 6 22 C12 18 20 18 24 24 C26 22 29 22 32 26 C35 22 38 22 40 24 C44 18 52 18 58 22 C56 16 56 10 62 6 C54 4 48 8 50 12 C42 10 36 14 32 22 Z"></path></svg>
        </div>
      </div>

    </div>
  </header>

  <section aria-label="Presentación" style="background: #120D0F; border-bottom: 1px solid #3A2A2C">
    <div style="max-width: 860px; margin: 0 auto; padding: 80px 24px 84px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center">
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 16px">
        <span style="display: block; width: 64px; height: 1px; background: #5A3A3E"></span>
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 0 L14 7 L7 14 L0 7 Z" fill="#8E1B22" stroke="#D9574F" stroke-width="1"></path></svg>
        <span style="display: block; width: 64px; height: 1px; background: #5A3A3E"></span>
      </div>
      <p style="margin: 0; font-size: clamp(24px, 3.2vw, 34px); line-height: 1.45; font-style: italic; color: #E8DCC4">Las fotos son el recuerdo inmortal de lo vivido en una noche mágica. <button type="button" onClick="{{openEye}}" aria-label="Abrir The Eye" style="display: inline; padding: 0; margin: 0; border: none; background: none; font-style: normal; font-family: 'Cinzel', serif; font-size: 0.82em; letter-spacing: 0.06em; color: #D9574F; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px">The Eye</button>, el ojo que lo hizo posible, te invita a explorar la historia vivida por el Conde, por su Novia y el resto de personajes que asistieron a <span style="font-style: normal; font-family: 'Cinzel', serif; font-size: 0.82em; letter-spacing: 0.06em; color: #D9574F">The Guest House</span>.</p>
      <div aria-hidden="true" style="display: flex; align-items: center; gap: 16px">
        <span style="display: block; width: 64px; height: 1px; background: #5A3A3E"></span>
        <svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 0 L14 7 L7 14 L0 7 Z" fill="#8E1B22" stroke="#D9574F" stroke-width="1"></path></svg>
        <span style="display: block; width: 64px; height: 1px; background: #5A3A3E"></span>
      </div>
    </div>
  </section>

  <section id="test" aria-label="Test: qué personaje sos" style="border-bottom: 1px solid #3A2A2C; background: radial-gradient(ellipse at 50% 0%, #241018 0%, #0E0B0C 65%)">
    <div style="max-width: 920px; margin: 0 auto; padding: 88px 24px 96px; display: flex; flex-direction: column; align-items: center; gap: 36px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <p style="margin: 0; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.34em; text-transform: uppercase; color: #D9574F">El test del Conde</p>
        <h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(34px, 5.4vw, 60px); line-height: 1.05; color: #F3EAD8">¿Quién fuiste esa noche?</h2>
        <p style="margin: 0; max-width: 520px; font-size: 22px; font-style: italic; color: #C9BBA3">Seis preguntas. Una sola verdad. Descubrí qué personaje de The Guest House llevás dentro.</p>
      </div>

      <div data-region="quiz" style="width: 100%; max-width: 720px; background: #161113; border: 1px solid #3A2A2C; box-sizing: border-box">
        <sc-if value="{{quizAsking}}" hint-placeholder-val="{{ true }}">
          <div class="zk-stage" style="display: flex; flex-direction: column; gap: 24px; padding: 36px 32px 40px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
              <p style="margin: 0; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: #A8998A">Pregunta {{qNum}} de {{qTotal}}</p>
              <div aria-hidden="true" style="display: flex; gap: 8px">
                <sc-for list="{{qDots}}" as="d" hint-placeholder-count="6">
                  <span style="{{d.style}}"></span>
                </sc-for>
              </div>
            </div>
            <h3 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 600; font-size: clamp(22px, 3vw, 30px); line-height: 1.25; color: #F3EAD8">{{q.text}}</h3>
            <div style="display: flex; flex-direction: column; gap: 12px">
              <sc-for list="{{q.options}}" as="o" hint-placeholder-count="4">
                <button type="button" class="zk-opt" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 16px; width: 100%; min-height: 60px; padding: 14px 20px; text-align: left; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 21px; line-height: 1.3; color: #E8DCC4; background: #0E0B0C; border: 1px solid #3A2A2C">
                  <span style="flex-shrink: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 14px; color: #D9574F; border: 1px solid #5A3A3E; transform: rotate(45deg)"><span style="transform: rotate(-45deg)">{{o.letter}}</span></span>
                  <span>{{o.label}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{quizDone}}" hint-placeholder-val="{{ false }}">
          <div class="zk-stage" style="display: flex; flex-wrap: wrap; align-items: center">
            <div style="flex: 1 1 240px; min-width: 0; display: flex; justify-content: center; padding: 32px 24px; background: radial-gradient(circle at 50% 40%, #3A0F18 0%, #161113 70%)">
              <img src="{{r.cover}}" alt="{{r.alt}}" style="width: 100%; max-width: 240px; display: block; filter: drop-shadow(0 0 28px rgba(217,87,79,0.4))">
            </div>
            <div style="flex: 999 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 36px 32px 40px">
              <p style="margin: 0; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: #D9574F">Esa noche fuiste</p>
              <p style="margin: 0; font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.05; color: #F3EAD8">{{r.name}}</p>
              <p style="margin: 0; font-size: 21px; line-height: 1.5; font-style: italic; color: #E8DCC4">{{r.desc}}</p>
              <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
                <button type="button" onClick="{{openResult}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 0 28px; font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; background: #8E1B22; border: 1px solid #D9574F; color: #FFFFFF">Ver sus fotos</button>
                <button type="button" onClick="{{restartQuiz}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 0 28px; font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; background: transparent; border: 1px solid #5A3A3E; color: #E8DCC4">Repetir</button>
              </div>
            </div>
          </div>
        </sc-if>
      </div>
    </div>
  </section>

  <main data-region="gallery" id="galeria" style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 96px; display: flex; flex-direction: column; gap: 40px">
    <nav aria-label="Filtrar carpetas" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </nav>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px">
      <sc-for list="{{shown}}" as="c" hint-placeholder-count="8">
        <button type="button" class="zk-card" onClick="{{c.open}}" aria-label="Abrir {{c.name}}" style="display: flex; flex-direction: column; width: 100%; padding: 0; margin: 0; text-align: left; font: inherit; color: inherit; background: #161113; border: 1px solid #3A2A2C">
          <span style="display: flex; margin: 16px 16px 0; aspect-ratio: 3 / 4">
            <img src="{{c.cover}}" alt="{{c.alt}}" style="width: 100%; height: 100%; object-fit: contain; display: block">
          </span>
          <span style="display: flex; flex-direction: column; gap: 6px; padding: 20px 20px 24px; flex-grow: 1; width: 100%; box-sizing: border-box">
            <span style="display: block; font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: #D9574F">{{c.numeral}} · {{c.kindLabel}}</span>
            <span style="display: block; font-family: 'Cinzel', serif; font-weight: 600; font-size: 24px; line-height: 1.2; color: #F3EAD8">{{c.name}}</span>
            <span class="zk-cue" style="display: inline-flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 16px; min-height: 44px; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #C9BBA3">Descubrir
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
            </span>
          </span>
        </button>
      </sc-for>
    </div>
  </main>

  <section aria-label="La cena" style="border-top: 1px solid #3A2A2C; background: #120D0F">
    <div style="max-width: 1240px; margin: 0 auto; padding: 80px 24px 88px; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center">
      <p style="margin: 0; font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.34em; text-transform: uppercase; color: #D9574F">Epílogo</p>
      <h2 style="margin: 0; font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(32px, 5vw, 56px); line-height: 1.05; color: #F3EAD8">La cena</h2>
      <p style="margin: 0; max-width: 620px; font-size: 22px; font-style: italic; color: #C9BBA3">Todos a la misma mesa, hasta los que llegaron de lejos. Nadie se fue antes del amanecer.</p>
      <img src="96c1a37bf43b55e6fe954ebb5d81a86c.jpg" alt="Ilustración: todos los personajes cenando en la mesa larga de The Guest House, con The Present Spirit flotando sobre ellos y The Eye fotografiándolos desde la cabecera" style="width: 100%; height: auto; display: block; border: 1px solid #5A3A3E; box-shadow: 0 30px 80px rgba(0,0,0,0.5)">
    </div>
  </section>

  <section aria-label="Dedicatoria" style="padding: 72px 24px 80px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; background: radial-gradient(ellipse at 50% 30%, rgba(142,27,34,0.28) 0%, rgba(14,11,12,0) 65%)">
    <svg width="72" height="32" viewBox="0 0 64 28" aria-hidden="true" fill="#120A10" stroke="#D9574F" stroke-width="1.2" stroke-linejoin="round"><path d="M32 22 C28 14 22 10 14 12 C16 8 10 4 2 6 C8 10 8 16 6 22 C12 18 20 18 24 24 C26 22 29 22 32 26 C35 22 38 22 40 24 C44 18 52 18 58 22 C56 16 56 10 62 6 C54 4 48 8 50 12 C42 10 36 14 32 22 Z"></path></svg>

<script>

class DCLogic { constructor(props) { this.props = props || {}; } setState(p) { Object.assign(this.state, p); window.__rerender(); } }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', flash: 0, openIdx: -1, qStep: 0, answers: [], alertUrl: '', ack: false };

  renderVals() {
    var base = 'https://drive.google.com/drive/folders/';
    var data = [
      { name: 'The Count', desc: 'El anfitrión. Abrió las puertas de su castillo por una sola noche y pidió a cambio lo de siempre: que nadie se fuera antes del amanecer.', kind: 'char', id: '16Juslc4Vg-TG-7RkxlXquLviu1Cf3Rui', cover: '3e277004057d3d99c590f4223bbe95bf.svg', alt: 'Vitral: murciélago ante una luna roja', previews: ['4f88883dddf2df9eacd274f3f6b398d8.jpg', 'af90f3c6446b673fd2c64c79501f4a2c.jpg', '37f13fbfb246132f4c1121f5479e49a8.jpg', '361bd627ea7eddacfe3ece867c7823e4.jpg'] },
      { name: 'The Bride', desc: 'De negro y rosas rojas, con perlas y un collar de sangre, para una boda que nunca termina. Guarda más secretos que todo el castillo.', kind: 'char', id: '1GjnFLXdXjO_pT0nK0vm9fhvZ0ElxKri1', cover: '1651937308379becdb6a1df655af0aee.svg', alt: 'Vitral: vestido negro con rosas rojas, perlas y collar de sangre', previews: ['2af9d5b68be5d0214b8c68be55dbd370.jpg', 'a7241e7a80d99770e54115e356e7b876.jpg', 'cc713e07e0f23dd8c2a6022a3abcf832.jpg', '9c20abebfd735914b7beeb9f9cd6fa8f.jpg'] },
      { name: 'The Devil', desc: 'Llegó sin invitación, como siempre. Nadie recuerda haberle abierto la puerta, pero todos brindaron con él.', kind: 'char', id: '1D-nFyppITOJEoX-f01oFFpOMwEvJxrlg', cover: '1bbbe1faf1280334218dc26329183175.svg', alt: 'Vitral: cuernos sobre una llama', previews: ['e837919c705abcc138055859515649d9.jpg', '2b0bf64834b0f529243fa2a83007bf58.jpg', '23fa769a3c4cd705f434640a2f4a808e.jpg', '5db92e46a7662b38bfbb6880791e7965.jpg'] },
      { name: 'The Enchantress', desc: 'Lee la luna como quien lee un libro. Le basta una mirada para que la noche cambie de rumbo.', kind: 'char', id: '1i0yEwEd5xHt5ODFFFV7KvZo5g1REGWuL', cover: '494b8001a9c55fbc5c4b28f25bb23c64.svg', alt: 'Vitral: mantilla roja, velas y calavera de ojos encendidos', previews: ['776fb9e3f9d2fed20c9953a12fec14a0.jpg', '5f81c6dcb2a54ac4e0f3cb065c18fc40.jpg', 'e055da96c172ad73217f04e1708401fc.jpg', '8a39650f485d2293b9b43999642bd2bd.jpg'] },
      { name: 'The Jeweler', desc: 'Trajo piedras que brillan en la oscuridad y un precio para cada una. Ninguna se paga con dinero.', kind: 'char', id: '1PqeRbOjqH8zGTCKV_EVqIKyTFCK_F5_p', cover: '497e325e841fb426c98552e8d4167c29.svg', alt: 'Vitral: cadenas plateadas y reloj de bolsillo', previews: ['eeca000086e526face5bd5827130e73d.jpg', 'db8743ba9c2e259f478417aa5c4d6a5e.jpg', '468bb92714433cf3d4fbf35fa85b9f34.jpg', '3a7ef711419d5fdde1146bcf2b442081.jpg'] },
      { name: 'The Fair Lady', desc: 'Encaje blanco sobre luto negro. Una dama de pocas palabras que lo vio todo desde la penumbra y no se lo contó a nadie.', kind: 'char', id: '1RCxC8pRe1IAruXprzhOwEmJIlc1FitGM', cover: 'e0bac4cce7e8322914953b88ea02b3fa.svg', alt: 'Vitral: camafeo, pechera de encaje blanco y abanico', previews: ['2a7c3f0a73084af33e4cc5053f4fd9d6.jpg', '52e9ddfa09825df4cbb07cfddc40e045.jpg', 'bb727964d3dedfbac7ad196046778d0c.jpg', '24ea89640ba785190195c406b9712584.jpg'] },
      { name: 'The Deathly Lovers', desc: 'Un amor que juró durar más allá de la muerte, y cumplió. Bailaron hasta que el reloj olvidó dar la hora.', kind: 'rel', id: '19tc-vNUXO_k0bLP7EZykb_W-ETZM7Llg', cover: 'ca54bf8354aac6519e230ea493fddf7e.svg', alt: 'Vitral: dos corazones atravesados por una daga', previews: ['9381a4ad8a077739f32f264c7c9abf48.jpg', 'd0e2ea6fb5636d48f05a0dc648e15820.jpg', '16f351cb696668b7f965b557f190abc5.jpg', 'e40fbb76c299a16352b59535085328b4.jpg'] },
      { name: 'The Friends', desc: 'Los que llegaron por el Conde y se quedaron por la fiesta. Copas en alto hasta que se apagó la última vela.', kind: 'rel', id: '1xRVMpN9ysmyaSYR308siAdm8SL_erAM9', cover: '5dd95068354d945eb5e456f64a6c1b0a.svg', alt: 'Vitral: tres copas de vino en un brindis', previews: ['e301d4f1f8bee5c6e79896899f227a60.jpg', 'b3d107f266ad2906f4ddc3a5370fac6f.jpg', '905c3f7047c97a1c3c3e07440f2659b3.jpg', '4701beac9e8aaee24ad30483db7b6ba8.jpg'] },
      { name: 'The Guest House', desc: 'La casa que los recibió a todos. Sus pasillos, sus velas y sus rincones, retratados antes del alba.', kind: 'place', id: '1WtsG4YVNBZV1t4GiVtcWM2AK2wpEGz2p', cover: '04a65a82fac27f2d8bc7addd79c0e08e.svg', alt: 'Vitral: mansión gótica bajo la luna', previews: ['37e9b2b5c5a78f8e0a622cc9174b8a7c.jpg', 'ac8455a9abd800b04f41a79df682097b.jpg', 'cd26cfd48153bdc68b1455ca4de22a93.jpg', '9a9226e266cd2ea185935d7f7b75bbc5.jpg'] },
      { name: 'The Present Spirit', desc: 'Vive lejos, pero esa noche cruzó el mar envuelta en neblina. Llegó con una corona de rosas y el mejor regalo de todos: estar presente.', kind: 'char', id: '1m56EnJvc-pTlQSF9QaD-4HiYRFLcJDoj', cover: '4d1ab5636d37f5dfa9438a9d6f49b60b.svg', alt: 'Vitral: espíritu con corona de rosas y halo dorado', previews: ['2b1aff9b4211028d0dfbe1fa7faae232.jpg', '25370d39c8ff6295a87d228293288832.jpg', 'e49daaa625c1c3bd0c59d5358e10397e.jpg', '8761af7f5808a3192f6a890dfc3a059f.jpg'] },
      { name: 'The Eye', desc: 'Todo lo ve, todo lo escribe. Estuvo en cada rincón de la noche sin que nadie lo notara, y gracias a él, nada de lo que pasó se va a olvidar.', kind: 'char', id: '1VMllnfarmEcIwXIGQ4W1IfK0b18aHZwR', cover: '5328c456ea62a44a54e9fadf42e95703.svg', alt: 'Vitral: un ojo que todo lo ve sobre un libro abierto y una pluma', previews: ['1f01eb58c9ff2aea03e88ad2af952695.jpg', '4c3dda9cfb07670a574fe366dbe97909.jpg', '91282e4c363f37ae3997318cd74ee718.jpg', '744b331263f297615818ffaaf377e94c.jpg'] }
    ];
    var labels = { char: 'Personaje', rel: 'Relación', place: 'Lugar' };
    var numerals = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
    var self = this;
    var current = this.state.filter;
    var all = data.map(function (d, i) {
      return {
        name: d.name,
        kind: d.kind,
        kindLabel: labels[d.kind],
        numeral: numerals[i] || String(i + 1),
        cover: d.cover,
        alt: d.alt,
        desc: d.desc,
        url: base + d.id,
        slots: (d.previews && d.previews.length ? d.previews : [null, null, null, null]).map(function (src, k) {
          return { hasPhoto: !!src, empty: !src, src: src || '', alt: d.name + ' — foto ' + (k + 1) };
        }),
        open: function () { self.setState({ openIdx: i }); }
      };
    });
    var shown = current === 'all' ? all : all.filter(function (c) { return c.kind === current; });
    var defs = [
      { key: 'all', label: 'Todas' },
      { key: 'char', label: 'Personajes' },
      { key: 'rel', label: 'Relaciones' },
      { key: 'place', label: 'Lugares' }
    ];
    var filters = defs.map(function (f) {
      var on = f.key === current;
      return {
        label: f.label,
        pick: function () { self.setState({ filter: f.key }); },
        style: 'min-height: 44px; padding: 0 22px; cursor: pointer; font-family: Cinzel, serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; border: 1px solid ' + (on ? '#D9574F' : '#3A2A2C') + '; background: ' + (on ? '#8E1B22' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#C9BBA3')
      };
    });
    // Test: 0 Count, 1 Bride, 2 Devil, 3 Enchantress, 4 Jeweler, 5 Fair Lady, 6 Lovers, 7 Friends, 8 Guest House, 9 Spirit, 10 Eye
    var Q = [
      { text: 'Llegás a la fiesta. ¿Qué hacés primero?', options: [
        ['Saludo a todos como si fuera mi casa', [9, 0]],
        ['Busco a mi persona favorita y no la suelto', [6, 1]],
        ['Voy directo a pedir la primera ronda', [7, 2]],
        ['Observo el lugar en silencio, desde una esquina', [10, 3]] ] },
      { text: '¿Qué no puede faltar en tu disfraz?', options: [
        ['Algo que brille', [4, 3]],
        ['Una capa', [0, 2]],
        ['Un velo o encaje', [1, 6]],
        ['Llaves, velas o algún detalle antiguo', [8, 5]] ] },
      { text: 'Son las dos de la mañana. ¿Dónde estás?', options: [
        ['En el centro de la pista', [7, 6]],
        ['Contando secretos en un pasillo', [5, 3]],
        ['Convenciendo a alguien de quedarse un rato más', [2, 0]],
        ['Recorriendo la casa y admirando cada rincón', [8, 10]] ] },
      { text: '¿Qué te llevarías del castillo?', options: [
        ['Una joya del cofre', [4, 2]],
        ['Un retrato del salón', [10, 1]],
        ['La llave de la puerta que nadie abre', [3, 5]],
        ['Las copas del brindis', [7, 9]] ] },
      { text: 'Tu frase de la noche:', options: [
        ['«Nadie se va antes del amanecer.»', [0, 7]],
        ['«Para siempre, ¿verdad?»', [1, 6]],
        ['«Yo no fui… esta vez.»', [2, 4]],
        ['«Ya sabía que esto iba a pasar.»', [10, 5]] ] },
      { text: 'Sale el sol. ¿Qué hacés?', options: [
        ['Me escondo antes de que me toque la luz', [0, 3]],
        ['Sigo bailando con la misma persona', [6, 1]],
        ['Hago inventario de lo que quedó', [4, 5]],
        ['Me quedo a dormir en el sofá de la casa', [9, 8]] ] }
    ];
    var letters = ['A', 'B', 'C', 'D'];
    var step = this.state.qStep;
    var answers = this.state.answers;
    var quizDone = step >= Q.length;
    var q = { text: '', options: [] };
    if (!quizDone) {
      q = {
        text: Q[step].text,
        options: Q[step].options.map(function (o, k) {
          return {
            letter: letters[k],
            label: o[0],
            pick: function () {
              self.setState({ answers: self.state.answers.concat([o[1]]), qStep: self.state.qStep + 1 });
            }
          };
        })
      };
    }
    var resultIdx = 0;
    if (quizDone) {
      var score = all.map(function () { return 0; });
      answers.forEach(function (keys, n) {
        var w = 1 + n * 0.01;
        score[keys[0]] += w;
        score[keys[1]] += w * 0.999;
      });
      score.forEach(function (v, k) { if (v > score[resultIdx]) { resultIdx = k; } });
    }
    var r = all[resultIdx];
    var qDots = Q.map(function (x, k) {
      var on = k < step || k === step;
      return { style: 'display: block; width: 8px; height: 8px; transform: rotate(45deg); background: ' + (k < step ? '#D9574F' : 'transparent') + '; border: 1px solid ' + (on ? '#D9574F' : '#5A3A3E') };
    });
    var flash = this.state.flash;
    var oi = this.state.openIdx;
    var m = oi >= 0 && all[oi] ? all[oi] : { name: '', numeral: '', kindLabel: '', cover: '', alt: '', desc: '', url: '', slots: [] };
    return {
      shown: shown,
      filters: filters,
      alertOpen: !!this.state.alertUrl,
      alertUrl: this.state.alertUrl,
      ack: this.state.ack,
      noAck: !this.state.ack,
      toggleAck: function () { self.setState({ ack: !self.state.ack }); },
      closeAlert: function () { self.setState({ alertUrl: '' }); },
      askDrive: function () { self.setState({ alertUrl: m.url }); },
      askAlbum: function () { self.setState({ alertUrl: base + '10hZf6bi2wxd2YYwNHyOL4LEa6w8R_KLT' }); },
      quizAsking: !quizDone,
      quizDone: quizDone,
      q: q,
      qNum: Math.min(step + 1, Q.length),
      qTotal: Q.length,
      qDots: qDots,
      r: r,
      openResult: function () { self.setState({ openIdx: resultIdx }); },
      restartQuiz: function () { self.setState({ qStep: 0, answers: [] }); },
      modalOpen: oi >= 0,
      m: m,
      close: function () { self.setState({ openIdx: -1 }); },
      prevName: all[(oi - 1 + all.length) % all.length].name,
      nextName: all[(oi + 1) % all.length].name,
      goPrev: function () { self.setState({ openIdx: (oi - 1 + all.length) % all.length }); var p = document.querySelector('.zk-panel'); if (p) { p.scrollTop = 0; } },
      goNext: function () { self.setState({ openIdx: (oi + 1) % all.length }); var p = document.querySelector('.zk-panel'); if (p) { p.scrollTop = 0; } },
      openEye: function () { self.setState({ openIdx: all.length - 1 }); },
      flashClass: flash === 0 ? '' : (flash % 2 ? 'zk-fa' : 'zk-fb'),
      lightUp: function () { self.setState({ flash: self.state.flash + 1 }); }
    };
  }
}

(function () {
  var comp = new Component({});
  var tpl = document.getElementById('zk-template').content;
  var mount = document.getElementById('zk-mount');
  var regions = [];
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(/\{\{([^}]+)\}\}/g, function (_, p) { var v = get(scope, p); return v == null ? '' : String(v); });
  }
  function single(str) { var m = /^\s*\{\{([^}]+)\}\}\s*$/.exec(str); return m ? m[1] : null; }
  function renderChildren(src, dest, scope, top) { src.childNodes.forEach(function (n) { renderNode(n, dest, scope, top); }); }
  function renderNode(n, dest, scope, top) {
    if (n.nodeType === 3) { dest.appendChild(document.createTextNode(interp(n.nodeValue, scope))); return; }
    if (n.nodeType !== 1) return;
    var tag = n.localName;
    if (tag === 'sc-if') { if (get(scope, single(n.getAttribute('value')))) renderChildren(n, dest, scope, top); return; }
    if (tag === 'sc-for') {
      var list = get(scope, single(n.getAttribute('list'))) || [], as = n.getAttribute('as');
      list.forEach(function (item) { var s = Object.create(scope); s[as] = item; renderChildren(n, dest, s, top); });
      return;
    }
    var el = document.createElementNS(n.namespaceURI, n.localName);
    Array.prototype.forEach.call(n.attributes, function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) return;
      var p = single(val);
      if (name.indexOf('on') === 0 && p) {
        var fn = get(scope, p); if (typeof fn === 'function') el.addEventListener(name.slice(2), function (e) { fn(e); });
        return;
      }
      if (name === 'checked' && p) { el.checked = !!get(scope, p); return; }
      el.setAttribute(name, interp(val, scope));
    });
    var region = top && n.getAttribute('data-region');
    if (region) { regions.push({ src: n, el: el }); }
    renderChildren(n, el, scope, top && !region);
    if (region) { el.__src = n; }
    dest.appendChild(el);
  }
  window.__rerender = function () {
    var vals = comp.renderVals();
    regions.forEach(function (r) { r.el.textContent = ''; renderChildren(r.src, r.el, vals, false); });
    document.body.style.overflow = vals.modalOpen || vals.alertOpen ? 'hidden' : '';
  };
  var vals = comp.renderVals();
  vals.lightUp = function () {
    var f = document.getElementById('zk-flash');
    var next = f.classList.contains('zk-fa') ? 'zk-fb' : 'zk-fa';
    f.classList.remove('zk-fa', 'zk-fb'); f.classList.add(next);
  };
  renderChildren(tpl, mount, vals, true);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (comp.state.alertUrl) comp.setState({ alertUrl: '' }); else if (comp.state.openIdx >= 0) comp.setState({ openIdx: -1 }); }
  });
})();
